version: "2"
services:

  redis:
    container_name: redis
    image: redis
    ports: #6379
      - 6379:6379

  dockermongo:
    container_name: dockermongo
    image: mongo:3.6
    ports:
       - 27017:27017

  dockergres:
     container_name: dockergres
     build: ./bevrand.dataseeder/db
     ports:
       - 5434:5432
     environment:
       - POSTGRES_PASSWORD=postgres
       - POSTGRES_USER=postgres

  authenticationapi:
    container_name: authenticationapi
    build: ./bevrand.authenticationapi/bevrand.authenticationapi
    ports:
      - 4570:5000
    depends_on:
      - dockergres
    environment:
      - ASPNETCORE_ENVIRONMENT="Development"

  randomizerapi:
    container_name: randomizerapi
    build: ./bevrand.randomizerapi
    ports:
       - 4560:5000 # expose ports - HOST:CONTAINER
    depends_on:
       - playlistapi
    environment:
       - APP_SETTINGS=Coverage
       - HIGHSCORE_API=http://highscoreapi:5000/api/v1/

  playlistapi:
    container_name: playlistapi
    build: ./bevrand.playlistapi
    ports:
       - 4550:5000  # expose ports - HOST:CONTAINER
    depends_on:
       - dockermongo
    environment:
       - APP_SETTINGS=Coverage
       - MONGO_URL=mongodb://dockermongo:27017/admin

  proxyapi:
    container_name: proxyapi
    build: ./bevrand.proxyapi
    ports:
      - 4540:5000
    depends_on:
      - randomizerapi
      - playlistapi
      - authenticationapi
    environment:
      - NODE_ENV=development

  recommendationapi:
    container_name: recommendationapi
    build: ./bevrand.recommendationapi
    ports:
      - 4590:5000
    depends_on:
      - neo4j
    environment:
      - GO_ENV=docker

  highscoreapi:
    container_name: highscoreapi
    build: ./bevrand.highscoreapi
    environment:
    - GO_ENV=docker
    - GIN_MODE=release
    depends_on:
    - redis
    ports:
    - 4580:5000

  frontendapi:
    container_name: frontend
    build: ./bevrand.frontend
    ports:
    - 80:80
    depends_on:
    - randomizerapi
    - playlistapi
    - authenticationapi
    - proxyapi

  multivuerse:
    container_name: multivuerse
    build: ./bevrand.multivuerse
    environment:
    - NODE_ENV=production
    - PROXY_API_URL=http://localhost:4540
    ports:
    - 8081:80
    depends_on:
    - randomizerapi
    - playlistapi
    - authenticationapi
    - proxyapi

